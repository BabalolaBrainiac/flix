name: Post-Release QA

# Runs after a GitHub Release publishes. It downloads each published
# package, installs it, then drives the installed app through activation
# and playback for a movie, an anime title, and a TV show. No human input
# is required.
#
# The movie, anime, and TV show checks use small synthetic video files that
# this workflow generates and seeds locally (see examples/qa_check.rs). They
# do not come from a live catalog or a public tracker, so the check has no
# external network dependency for content and no copyright exposure from
# running unattended on every release.
#
# Every check drives the browser-preview playback path over plain HTTP, so
# no media player (VLC, mpv, or otherwise) is installed or launched on the
# runner. The anime check still exercises the real Japanese-audio/English-
# subtitle track selection: Flix runs that check before it rejects anime in
# the browser preview, so a specific BROWSER_UNSUPPORTED failure there is
# the expected, passing outcome (see examples/qa_check.rs).
#
# Normal playback writes into a fresh temporary directory per session, not
# the download directory, so fixtures cannot simply be dropped in ahead of
# time. examples/qa_check.rs sets FLIX_PLAYBACK_DIR (src/config.rs) to a
# fixed directory it controls, so librqbit can verify the pre-placed
# fixtures locally with zero network activity. This has no effect for a
# real user, who never sets that variable.
#
# QA_INVITE_CODE is an environment secret on the "release" environment (the
# same trust boundary release.yml already uses to publish): an invite code
# created once with `./scripts/admin.sh invite --max 10` from `gateway/` and
# stored with `gh secret set QA_INVITE_CODE --env release`. That script
# stays a local, owner-run tool because it holds production Cloudflare D1
# access; only the invite code it produced is a secret here, not the D1
# access itself.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check (e.g. v0.2.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  qa-macos:
    name: Post-Release QA (macOS)
    runs-on: macos-latest
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Checks out main, not the release tag: the QA tooling itself must be
      # the latest version regardless of which historical release is being
      # tested, since the published package is already built and immutable.
      - name: Checkout the QA tooling
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Build the QA check
        run: cargo build --release --example qa_check

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'Flix-macOS-universal.dmg' \
            --pattern 'SHA256SUMS.txt'

      # SHA256SUMS.txt records each path as release-artifacts/<name>/<name>
      # (actions/download-artifact nests each artifact in its own directory
      # of that name when release.yml builds it) - gh release download gives
      # a flat file with no such directory, so shasum -c's path check fails
      # even when the content is correct. Compare the hash value directly.
      - name: Verify checksum
        run: |
          set -euo pipefail
          expected="$(grep 'Flix-macOS-universal.dmg' SHA256SUMS.txt | awk '{print $1}')"
          actual="$(shasum -a 256 Flix-macOS-universal.dmg | awk '{print $1}')"
          [ "$expected" = "$actual" ] || { echo "Checksum mismatch: expected $expected, got $actual" >&2; exit 1; }

      - name: Mount the DMG and check the app bundle
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${TAG#v}"
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach Flix-macOS-universal.dmg -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          test -d "$MOUNT_DIR/Flix.app"
          test -f "$MOUNT_DIR/Flix.app/Contents/Info.plist"
          test -x "$MOUNT_DIR/Flix.app/Contents/MacOS/flix-desktop"
          test -f "$MOUNT_DIR/Flix.app/Contents/Resources/flix.icns"
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$MOUNT_DIR/Flix.app/Contents/Info.plist")"
          [ "$VERSION" = "$EXPECTED_VERSION" ] || { echo "Expected version $EXPECTED_VERSION in Info.plist, got $VERSION" >&2; exit 1; }
          echo "MOUNT_DIR=$MOUNT_DIR" >> "$GITHUB_ENV"

      - name: Run automated activation and playback QA
        env:
          QA_INVITE_CODE: ${{ secrets.QA_INVITE_CODE }}
        run: ./target/release/examples/qa_check --app "$MOUNT_DIR/Flix.app/Contents/MacOS/flix-desktop" --version "$EXPECTED_VERSION"

      - name: Unmount the DMG
        if: always()
        run: hdiutil detach "$MOUNT_DIR" -quiet || true

  qa-windows:
    name: Post-Release QA (Windows)
    runs-on: windows-latest
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Checks out main, not the release tag: the QA tooling itself must be
      # the latest version regardless of which historical release is being
      # tested, since the published package is already built and immutable.
      - name: Checkout the QA tooling
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || choco install ffmpeg -y

      - name: Build the QA check
        run: cargo build --release --example qa_check

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'Flix-Windows-x64-Setup.exe' \
            --pattern 'SHA256SUMS.txt'

      # See the macOS job's checksum step for why this compares the hash
      # value directly instead of using sha256sum -c on the recorded path.
      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep 'Flix-Windows-x64-Setup.exe' SHA256SUMS.txt | awk '{print $1}')"
          actual="$(sha256sum Flix-Windows-x64-Setup.exe | awk '{print $1}')"
          [ "$expected" = "$actual" ] || { echo "Checksum mismatch: expected $expected, got $actual" >&2; exit 1; }

      - name: Run the installer silently and check the install
        shell: pwsh
        run: |
          $tag = $env:TAG
          $expectedVersion = $tag.TrimStart("v")
          echo "EXPECTED_VERSION=$expectedVersion" >> $env:GITHUB_ENV

          $installDir = Join-Path $env:RUNNER_TEMP "flix-install"
          Start-Process -FilePath ".\Flix-Windows-x64-Setup.exe" -ArgumentList "/S", "/D=$installDir" -Wait

          $exePath = Join-Path $installDir "flix-desktop.exe"
          if (-not (Test-Path $exePath)) {
            throw "flix-desktop.exe was not found after a silent install."
          }

          $versionInfo = (Get-Item $exePath).VersionInfo
          $fileVersion = $versionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($fileVersion)) {
            throw "Windows executable product version is empty."
          }

          $normalizedVersion = $fileVersion.Trim()
          if ($normalizedVersion.Contains("+")) {
            $normalizedVersion = $normalizedVersion.Split("+")[0].Trim()
          }

          if ($normalizedVersion -ne $expectedVersion -and -not $normalizedVersion.StartsWith("$expectedVersion.")) {
            throw "Expected Windows executable product version to match $expectedVersion, got $fileVersion (normalized: $normalizedVersion)"
          }

          # Verify that the packaged Flix icon exists in the install directory or inside the executable resources
          $icoPath = Join-Path $installDir "flix.ico"
          $hasFlixIco = $false
          if (Test-Path $icoPath) {
            $item = Get-Item $icoPath
            if ($item.Length -gt 0) {
              $hasFlixIco = $true
            }
          }

          $hasFlixExeIcon = $false
          try {
            Add-Type @"
            using System;
            using System.Runtime.InteropServices;
            public class NativeIconHelper {
                public delegate bool EnumResourceNameCallback(
                    IntPtr module,
                    IntPtr type,
                    IntPtr name,
                    IntPtr parameter
                );
                [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Auto)]
                public static extern IntPtr LoadLibraryEx(string lpFileName, IntPtr hFile, uint dwFlags);
                [DllImport("kernel32.dll", SetLastError = true)]
                public static extern bool FreeLibrary(IntPtr hModule);
                [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Auto)]
                public static extern bool EnumResourceNames(
                    IntPtr module,
                    IntPtr type,
                    EnumResourceNameCallback callback,
                    IntPtr parameter
                );
                public const uint LOAD_LIBRARY_AS_DATAFILE = 0x00000002;
                public static readonly IntPtr RT_GROUP_ICON = (IntPtr)14;
                public static readonly IntPtr RT_ICON = (IntPtr)3;

                private static bool HasResourceType(IntPtr module, IntPtr type) {
                    bool found = false;
                    EnumResourceNameCallback callback = delegate(
                        IntPtr callbackModule,
                        IntPtr callbackType,
                        IntPtr name,
                        IntPtr parameter
                    ) {
                        found = true;
                        return false;
                    };
                    EnumResourceNames(module, type, callback, IntPtr.Zero);
                    GC.KeepAlive(callback);
                    return found;
                }

                public static bool HasIconResource(string path) {
                    IntPtr hModule = LoadLibraryEx(path, IntPtr.Zero, LOAD_LIBRARY_AS_DATAFILE);
                    if (hModule == IntPtr.Zero) return false;
                    try {
                        return HasResourceType(hModule, RT_GROUP_ICON)
                            || HasResourceType(hModule, RT_ICON);
                    } finally {
                        FreeLibrary(hModule);
                    }
                }
            }
          "@
            $hasFlixExeIcon = [NativeIconHelper]::HasIconResource($exePath)
          } catch {
            Write-Warning "Could not inspect executable icon resources with Win32 API: $_"
          }

          if (-not $hasFlixIco -and -not $hasFlixExeIcon) {
            throw "Expected packaged Flix icon resource or flix.ico in installation directory."
          }

          echo "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

      - name: Run automated activation and playback QA
        shell: bash
        env:
          QA_INVITE_CODE: ${{ secrets.QA_INVITE_CODE }}
        run: ./target/release/examples/qa_check.exe --app "$INSTALL_DIR/flix-desktop.exe" --version "$EXPECTED_VERSION"

  flag-regression:
    name: Flag a Post-Release Regression
    needs: [qa-macos, qa-windows]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Post-release QA regression in $TAG" \
            --label "qa,regression" \
            --body "$(cat <<EOF
          The automated post-release QA check failed for $TAG.

          At least one of macOS or Windows activation/playback checks did
          not pass (movie, anime with original Japanese audio, or TV show
          with the next-episode action). See the failed step in the run:

          $RUN_URL
          EOF
          )"

  record-success:
    name: Record QA Success
    needs: [qa-macos, qa-windows]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on issue #29
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment 29 \
            --repo "${{ github.repository }}" \
            --body "Automated post-release QA passed for $TAG on macOS and Windows: $RUN_URL" || true
