[package]
name = "flix"
version = "0.1.0"
edition = "2021"
description = "Torrent streamer with CLI, TUI, and desktop web UI. Searches Stremio catalogs, plays in mpv/VLC while downloading."
license = "MIT"
repository = "https://github.com/BabalolaBrainiac/flix"
readme = "README.md"
authors = ["Flix Contributors"]

[dependencies]
librqbit = "8.1.1"
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"
tokio-util = { version = "0.7", features = ["io"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
scraper = "0.20"
uuid = { version = "1.24.0", features = ["v4"] }
which = "8.0.5"
regex = "1.13.1"
tempfile = "3"
percent-encoding = "2"
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
keyring = { version = "3.6.1", features = ["apple-native", "windows-native"] }
zip = { version = "2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
web-ui = []

[[bin]]
name = "flix"
path = "src/main.rs"

[[bin]]
name = "flix-desktop"
path = "src/bin/flix_desktop.rs"
required-features = ["web-ui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.packager]
product-name = "Flix"
identifier = "com.babalolabrainiac.flix"
category = "Entertainment"
authors = ["Flix Contributors"]
description = "Private desktop torrent streaming client"
before-packaging-command = "cd web && npm ci && npm run build"

[[package.metadata.packager.binaries]]
path = "flix-desktop"
main = true

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
