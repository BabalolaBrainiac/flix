[package]
name = "flix"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight terminal torrent streamer that plays media in mpv/VLC while downloading"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BabalolaBrainiac/flix"
readme = "README.md"
authors = ["Flix Contributors"]

[dependencies]
librqbit = "8.1.1"
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"
tokio-util = { version = "0.7", features = ["io"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
sha2 = "0.10"
scraper = "0.20"
uuid = { version = "1.24.0", features = ["v4"] }
which = "8.0.5"
regex = "1.13.1"
tempfile = "3"
percent-encoding = "2"
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
keyring = "3.6.3"



[features]
default = []
web-ui = []

[[bin]]
name = "flix"
path = "src/main.rs"

[[bin]]
name = "flix-desktop"
path = "src/bin/flix_desktop.rs"
required-features = ["web-ui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

