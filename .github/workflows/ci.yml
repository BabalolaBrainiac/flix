name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle for desktop compile
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test suite
        run: cargo test --all-features

  windows-resource-check:
    name: Windows Resource Check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Windows desktop binary
        run: cargo build --locked --release --features web-ui --bin flix-desktop

      - name: Verify Windows product version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $expected = ($metadata.packages | Where-Object name -eq "flix").version
          $actual = (Get-Item "target/release/flix-desktop.exe").VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($actual)) {
            throw "Windows executable product version is empty."
          }
          $normalized = $actual.Trim().Split("+")[0].Trim()
          if ($normalized -ne $expected -and -not $normalized.StartsWith("$expected.")) {
            throw "Expected Windows product version $expected, got $actual."
          }

  web-check:
    name: Web Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check Svelte components
        run: npm run check

      - name: Run frontend unit tests
        run: npm test

      - name: Build web production bundle
        run: npm run build

  gateway-check:
    name: Cloudflare Gateway Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check gateway
        run: npx tsc --noEmit

      - name: Run gateway unit tests
        run: npm test
