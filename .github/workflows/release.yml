name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.4.0) - optional, defaults to Cargo.toml'
        required: false
        type: string
      commit:
        description: 'Commit SHA on main to publish (optional, defaults to HEAD)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve target and version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA="$WORKFLOW_SHA"
            IS_MANUAL=false
          else
            TARGET_SHA="${INPUT_COMMIT:-$(git rev-parse HEAD)}"
            IS_MANUAL=true
          fi

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA: $TARGET_SHA" >&2; exit 1; }
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || { echo "Commit $TARGET_SHA is not on main" >&2; exit 1; }

          git show "$TARGET_SHA:Cargo.toml" > /tmp/Cargo.toml
          CARGO_VERSION="v$(python3 -c 'import tomllib; print(tomllib.load(open("/tmp/Cargo.toml", "rb"))["package"]["version"])')"

          if [ -n "$INPUT_VERSION" ]; then
            RELEASE_TAG="$INPUT_VERSION"
            if [ "$RELEASE_TAG" != "$CARGO_VERSION" ]; then
              echo "Specified version $RELEASE_TAG does not match Cargo.toml version $CARGO_VERSION" >&2
              exit 1
            fi
          else
            RELEASE_TAG="$CARGO_VERSION"
          fi

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag format: $RELEASE_TAG" >&2; exit 1; }

          TAG_EXISTS=false
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          elif git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          if [ "$TAG_EXISTS" = "true" ]; then
            if [ "$IS_MANUAL" = "true" ]; then
              echo "Release $RELEASE_TAG already exists. Cannot republish an existing release." >&2
              exit 1
            else
              echo "Release $RELEASE_TAG already exists. Skipping automatic publication."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "commit=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-release-packages:
    name: Build Native Release Packages
    needs: [prepare-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            artifact_name: Flix-macOS-universal.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: Flix-Windows-x64-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build web bundle
        run: |
          cd web
          npm ci
          npm run build

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build macOS Universal DMG
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --locked --release --features web-ui --target aarch64-apple-darwin --bin flix-desktop
          cargo build --locked --release --features web-ui --target x86_64-apple-darwin --bin flix-desktop
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/flix-desktop \
            target/x86_64-apple-darwin/release/flix-desktop \
            -output target/universal-apple-darwin/release/flix-desktop
          cargo packager --release --formats dmg --target universal-apple-darwin --binaries-dir target/universal-apple-darwin/release --out-dir target/packager

      - name: Build Windows NSIS Installer
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --locked --release --features web-ui --target x86_64-pc-windows-msvc --bin flix-desktop
          cargo packager --release --formats nsis --target x86_64-pc-windows-msvc --binaries-dir target/x86_64-pc-windows-msvc/release --out-dir target/packager

      - name: Stage the package under a stable name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          built="$(find target/packager -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' \) | head -n 1)"
          if [ -z "$built" ]; then
            echo "No package file was produced under target/packager."
            exit 1
          fi
          cp "$built" "dist/${{ matrix.artifact_name }}"
          ls -l dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-release-packages]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          find . -type f -not -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          target_commitish: ${{ needs.prepare-release.outputs.commit }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/**
